<text x="550" y="500" text-anchor="middle" class="head">AI Agent Orchestrator · LangGraph</text>
<text x="550" y="529" text-anchor="middle" class="body">ReAct planning · tool routing · state and retry management</text>
<rect x="142" y="577" rx="16" width="376" height="120" class="inner"/>
<text x="330" y="619" text-anchor="middle" class="head">Code Explorer</text>
<text x="330" y="652" text-anchor="middle" class="body">AST · LSP · Tree-sitter</text>
<rect x="582" y="577" rx="16" width="376" height="120" class="inner"/>
<text x="770" y="619" text-anchor="middle" class="head">Bug Reproducer</text>
