# Copy this file to .github/workflows/ci.yml in The-Tourist-170/dummy_project.
#
# The repository ships three deliberately failing tests, so this workflow
# completes with a "failure" conclusion. GitHub then delivers a
# `workflow_run` webhook that ash-agent accepts and enqueues.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -q
