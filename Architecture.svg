<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" role="img" aria-label="Autonomous Self-Healing SWE Agent architecture">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#15263b"/></linearGradient>
 <linearGradient id="agent" x2="1" y2="0"><stop stop-color="#133a53"/><stop offset="1" stop-color="#164c51"/></linearGradient>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#82a6c4"/></marker>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#eaf3fc}.title{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#a8bfd4}.head{font-size:22px;font-weight:700}.body{font-size:16px;fill:#b9cde0}.small{font-size:14px;fill:#9fbbd2}.line{stroke:#82a6c4;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke:#45d3bb;stroke-width:3;fill:none;stroke-dasharray:10 7;marker-end:url(#arr)}.node{fill:#182e45;stroke:#345673;stroke-width:2}.inner{fill:#102d42;stroke:#426c84;stroke-width:1.5}</style>
</defs>
<rect width="1100" height="1160" fill="url(#bg)"/>
<text x="550" y="65" text-anchor="middle" class="title">Autonomous Self-Healing SWE Agent</text>
<text x="550" y="98" text-anchor="middle" class="sub">High-level architecture · event-driven diagnosis, repair, and verification</text>
<rect x="315" y="133" rx="16" width="470" height="108" class="node"/>
<text x="550" y="173" text-anchor="middle" class="head">GitHub / GitLab</text>
