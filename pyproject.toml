[project]
name = "ash-agent"
version = "0.1.0"
description = "Autonomous self-healing SWE agent: event-driven diagnosis, repair, and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ash-agent = "ash_agent.main:run"
ash-agent-worker = "ash_agent.queue.worker:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
